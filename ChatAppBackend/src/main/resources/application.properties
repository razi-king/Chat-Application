spring.application.name=ChatAppBackend
# Cloud hosts (Render, Railway, Koyeb ...) tell the app which port to use through $PORT
server.port=${PORT:8080}
# Timezone used for the dd-MM-yyyy HH:mm:ss timestamp in Response
spring.jackson.time-zone=${APP_TIMEZONE:Asia/Kolkata}

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/chatapp}
spring.data.mongodb.auto-index-creation=true

# Redis (presence, unread counters, rate limiting, logout blacklist)
# If Redis is not running the app still works using in-memory / MongoDB fallbacks (see util/RedisSafe)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=1s
spring.data.redis.connect-timeout=1s
spring.data.redis.repositories.enabled=false

# JWT (use a long random value in production, at least 32 characters)
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-nexus-chat-2026-very-long-key}
app.jwt.expiration-hours=72

# Frontend origin(s), comma separated
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

# Demo data (users, a server with channels, a group and DMs) created on first start
app.seed.enabled=${SEED_DEMO_DATA:true}
# Password of every demo account (users: razi, aisha, kabir, zoya, dev)
app.seed.password=${SEED_PASSWORD:nexus123}

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Every log line carries the request's correlation id (see config/RequestIdFilter)
logging.pattern.level=%5p [req:%X{requestId:-none}]
logging.level.org.springframework.data.redis=WARN
logging.level.io.lettuce=WARN
