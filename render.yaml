# Render Blueprint: deploys the Spring Boot backend as a free Docker web service.
# Render dashboard -> New -> Blueprint -> pick this GitHub repo. It reads this file.
# Secrets marked "sync: false" are typed in once in the Render dashboard (never committed).
services:
  - type: web
    name: nexus-chat-api
    runtime: docker
    plan: free
    # Closest Render region to India; create the Atlas cluster in Singapore/Mumbai too so DB calls stay short
    region: singapore
    rootDir: ChatAppBackend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: MONGODB_URI            # MongoDB Atlas connection string (mongodb+srv://.../chatapp)
        sync: false
      - key: JWT_SECRET             # long random string, generated by Render
        generateValue: true
      - key: CORS_ORIGINS           # your Vercel URL(s), e.g. https://nexus-chat.vercel.app,https://*.vercel.app
        sync: false
      - key: SPRING_DATA_REDIS_URL  # optional: Upstash rediss:// URL. Leave empty to run without Redis (fallback mode)
        sync: false
      - key: SEED_DEMO_DATA         # creates demo users/servers on the first start against an empty database
        value: "true"
      - key: SEED_PASSWORD          # password of the demo accounts
        sync: false
